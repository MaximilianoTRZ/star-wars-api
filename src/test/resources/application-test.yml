app:
  swapi:
    base-url: http://localhost:0
    connect-timeout: 2s
    read-timeout: 3s
    retry:
      initial-backoff: 10ms
  security:
    jwt:
      secret: test-secret-0123456789-0123456789-0123456789
    demo-user:
      password: test-password
    # Integration tests share the context and log in on every test; LoginRateLimitIT uses the real limit.
    login-rate-limit:
      capacity: 1000

management:
  server:
    port: 0
