# Production profile: no defaults for secrets.
# The app fails to start if JWT_SECRET or DEMO_USER_PASSWORD is missing.
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    demo-user:
      password: ${DEMO_USER_PASSWORD}

# JSON logs (Elastic Common Schema); the MDC requestId is included as a field.
logging:
  structured:
    format:
      console: ecs
