<!doctype html>
<!--
  Spring for GraphQL's GraphiQL page (spring-graphql 2.0.6, same CDN versions and integrity hashes) with:
  - an example query in the editor,
  - an Authorization header ready to paste the token into,
  - the header filled in when the URL carries #token=<jwt>. The fragment never reaches the server, so the
    token does not show up in any access log.
-->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL</title>
    <style>
        body {
            margin: 0;
        }
        #graphiql {
            height: 100dvh;
        }
        .loading {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
    </style>
    <link
            rel="stylesheet"
            href="https://esm.sh/graphiql@5.2.4/dist/style.css"
            integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh"
            crossorigin="anonymous"
    />
    <link
            rel="stylesheet"
            href="https://esm.sh/@graphiql/plugin-explorer@5.1.3/dist/style.css"
            integrity="sha384-vTFGj0krVqwFXLB7kq/VHR0/j2+cCT/B63rge2mULaqnib2OX7DVLUVksTlqvMab"
            crossorigin="anonymous"
    />
    <script type="importmap">
        {
          "imports": {
            "react": "https://esm.sh/react@19.2.7",
            "react/": "https://esm.sh/react@19.2.7/",
            "react-dom": "https://esm.sh/react-dom@19.2.7",
            "react-dom/": "https://esm.sh/react-dom@19.2.7/",
            "graphiql": "https://esm.sh/graphiql@5.2.4?standalone&external=react,react-dom,@graphiql/react,graphql",
            "graphiql/": "https://esm.sh/graphiql@5.2.4/",
            "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.3?standalone&external=react,@graphiql/react,graphql",
            "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.7?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
            "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
            "graphql": "https://esm.sh/graphql@17.0.2",
            "@emotion/is-prop-valid": "data:text/javascript,"
          },
          "integrity": {
            "https://esm.sh/react@19.2.7": "sha384-LO2cBox9zBA6AOWqno07582eanOcJxJyu4hwf3rg5CrZQ/XoPtgSAFlL6ezpFK0O",
            "https://esm.sh/react-dom@19.2.7": "sha384-upKKG1ShVOSXNAoNmdKSl8xWJl9L8fZ05Ki1rHXpPijT4hIS/FFh+88dxk72+jre",
            "https://esm.sh/graphiql@5.2.4": "sha384-3feoWeu5QZYyfhHQyP8i+VBW+tYf58tTwgBb8Fsrw2QlP/YRBR2tscNGcYyRDtHC",
            "https://esm.sh/graphiql@5.2.4?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-n1sWmquV8wXH/vbn5Q8BaQAw8iAFku5zAs2fPBrht0L/OP4/qgZWL/v/WhMLFPBH",
            "https://esm.sh/@graphiql/plugin-explorer@5.1.3": "sha384-aDt72jaNBi2he5K4f47qh+xnS6Za54L6vuoNt6KtToLAJfebp23zCaAl3zXGl7dV",
            "https://esm.sh/@graphiql/react@0.37.7?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-U8awo9eG6M8scx4fjis/pNfYja4d5EtxOFYcmvDGG8K4Rt/bGB6Km1hxbQXZr9qH",
            "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql": "sha384-+cNTwZgIW33q7A4E+ZoCMqzcXdfVIc2VthQvJ0uDpRXERBWYuDKPVMzvdQU8x48o",
            "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
          }
        }
    </script>
    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
        import { createGraphiQLFetcher } from '@graphiql/toolkit';
        import { explorerPlugin } from '@graphiql/plugin-explorer';
        import 'graphiql/setup-workers/esm.sh';

        const params = new URLSearchParams(window.location.search);
        const path = params.get("path") || "/graphql";
        const url = new URL(path, `${location.protocol}//${location.host}`);
        if (url.origin !== location.origin) {
            throw new Error('GraphQL endpoint must resolve to the same origin as this page');
        }
        const wsPath = params.get("wsPath") || "/graphql";
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsOrigin = `${wsProtocol}//${location.host}`;
        const subscriptionUrl = new URL(wsPath, wsOrigin);
        if (subscriptionUrl.origin !== wsOrigin) {
            throw new Error('GraphQL WebSocket endpoint must resolve to the same origin as this page');
        }
        const gqlFetcher = createGraphiQLFetcher({'url': url, 'subscriptionUrl': subscriptionUrl});
        const plugins = [HISTORY_PLUGIN, explorerPlugin()];
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const token = fragment.get("token");
        if (token) {
            // Keep the token out of the address bar and the browser history
            history.replaceState(null, "", window.location.pathname + window.location.search);
        }
        const initialHeaders = JSON.stringify({ Authorization: `Bearer ${ token || "<token from POST /api/v1/auth/login>" }` }, null, 2);
        const exampleQuery = `# Star Wars API. The JWT goes in Headers (below).
# Run with the pink button; Docs (top left) lists every query.
{
  people(name: "skywalker") {
    content { id name }
    totalElements
  }
  film(id: 1) {
    title
    episodeId
    director
  }
}
`;

        function App() {
            return React.createElement(GraphiQL, {
                fetcher: gqlFetcher,
                defaultEditorToolsVisibility: true,
                headerEditorEnabled: true,
                shouldPersistHeaders: false,
                initialHeaders: initialHeaders,
                defaultHeaders: initialHeaders,
                initialQuery: exampleQuery,
                defaultQuery: exampleQuery,
                defaultTabs: [{ query: exampleQuery, headers: initialHeaders }],
                plugins: plugins,
            });
        }

        const container = document.getElementById('graphiql');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</head>
<body>
    <div id="graphiql"><div class="loading">Loading...</div></div>
</body>
</html>
