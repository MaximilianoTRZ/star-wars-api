spring:
  application:
    name: star-wars-api
  threads:
    virtual:
      enabled: true
  web:
    # Validation and error messages always in English
    locale: en
    locale-resolver: fixed

app:
  swapi:
    base-url: https://www.swapi.tech/api
    connect-timeout: 2s
    # SWAPI takes 2 to 9 s per request from Render
    read-timeout: 10s
  security:
    jwt:
      # Local development default only. The prod profile requires JWT_SECRET.
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789}
      issuer: star-wars-api
      ttl: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
